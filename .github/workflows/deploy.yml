name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up FFmpeg
        id: ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Restore responsive image cache
        uses: actions/cache@v4
        with:
          path: .cache/responsive-cache
          key: ${{ runner.os }}-responsive-media-${{ steps.ffmpeg.outputs.ffmpeg-version }}-${{ hashFiles('src/media/**', 'scripts/optimize-media.js') }}
          restore-keys: |
            ${{ runner.os }}-responsive-media-${{ steps.ffmpeg.outputs.ffmpeg-version }}-

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build Eleventy site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
