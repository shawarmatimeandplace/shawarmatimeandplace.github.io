name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up FFmpeg
        id: ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Restore responsive image cache
        uses: actions/cache@v4
        with:
          path: .cache/responsive-cache
          key: ${{ runner.os }}-responsive-media-${{ steps.ffmpeg.outputs.ffmpeg-version }}-${{ hashFiles('src/media/**', 'scripts/optimize-media.js') }}
          restore-keys: |
            ${{ runner.os }}-responsive-media-${{ steps.ffmpeg.outputs.ffmpeg-version }}-

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
